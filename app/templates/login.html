{% extends "base.html" %}
{% block title %}Login - PCB Defect Inspector{% endblock %}
{% block content %}
<div class="card auth-card">
  <h2>Login</h2>
  <p class="muted">Welcome back. Please sign in.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form">
    <label>Username
      <input type="text" name="username" required placeholder="Your username" />
    </label>
    <label>Password
      <input type="password" name="password" required placeholder="Your password" />
    </label>
    <button class="btn primary" type="submit">Login</button>
  </form>
  <p class="muted">No account? <a href="/register">Register</a></p>
</div>
{% endblock %}
